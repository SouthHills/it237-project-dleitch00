on:
  pull_request:
    branches: ["dev"]

name: Linux_Container_Workflow

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20.19.0'

      - name: 'Install Dependencies'
        working-directory: client
        run: npm install

      - name: 'Run Angular Unit Tests'
        working-directory: client
        run: npx ng test --watch=false --browsers=ChromeHeadless

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: 'actions/checkout@v4'
        
      - name: 'Login via Azure CLI'
        uses: 'azure/login@v1'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Login to Container Registry'
        uses: 'azure/docker-login@v1'
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 'Build and Push Server Image'
        run: |
          docker build . -f server-dockerfile -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/server:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/server:${{ github.sha }}

      - name: 'Build and Push Client Image'
        run: |
          docker build . -f client-dockerfile -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/client:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/client:${{ github.sha }}

      - name: Deploy Server to Azure Container Instances
        uses: 'azure/aci-deploy@v1'
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          dns-name-label: ${{ secrets.RESOURCE_GROUP }}-server-${{ github.run_number }}
          image: ${{ secrets.REGISTRY_LOGIN_SERVER }}/server:${{ github.sha }}
          registry-login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          name: aci-server-auto
          location: 'westus2'
          secure-environment-variables: |
            DB_HOST=${{ secrets.DB_HOST }}
            SA_PASSWORD=${{ secrets.SA_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}

      - name: 'Deploy Client to Azure Container Instances'
        uses: 'azure/aci-deploy@v1'
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          dns-name-label: ${{ secrets.RESOURCE_GROUP }}-client-${{ github.run_number }}
          image: ${{ secrets.REGISTRY_LOGIN_SERVER }}/client:${{ github.sha }}
          registry-login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          name: aci-client-auto
          location: 'westus2'


