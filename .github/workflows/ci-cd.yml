on:
  pull_request:
    branches: ["main"]

name: Linux_Container_Workflow

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20.19.0'

      - name: 'Install Dependencies'
        working-directory: client
        run: npm install

      - name: 'Run Angular Unit Tests'
        working-directory: client
        run: npm run ng test --watch=false

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: 'actions/checkout@v4'

      - name: 'Login via Azure CLI'
        uses: 'azure/login@v1'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Login to Container Registry'
        uses: 'azure/docker-login@v1'
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 'Build and Push Server Image'
        run: |
          docker build . -f server-dockerfile -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/server:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/server:${{ github.sha }}

      - name: 'Build and Push Client Image'
        run: |
          docker build . -f client-dockerfile -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/client:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/client:${{ github.sha }}

      - name: 'Deploy Client to Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'LOB'
          publish-profile: ${{ secrets.CLIENTAZURE }}
          images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/client:${{ github.sha }}'

      - name: 'Deploy Server to Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'LOB-Backend'
          publish-profile: ${{ secrets.SERVERAZURE }}
          images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/server:${{ github.sha }}'
