
<main class="container">
  @if (vendor() || isNewVendor())
  {
    @if (isNewVendor())
    {
      <h1 class="mb-4">New Vendor</h1>
    }
    @else
    {
      <h1 class="mb-4">
        Vendor Details: {{ vendor()!.vendorName }}
      </h1>
    }

    <form class="row gap-3">
      <div class="col-4">
        <label for="vendor-id" class="form-label">Vendor ID</label>
        <input class="form-control" id="vendor-id"
               name="vendorID" type="number"
               [(ngModel)]="modifiedVendor()!.vendorID"/>
      </div>

      <div class="col-3">
        <label for="vendor-name" class="form-label">Name</label>
        <input class="form-control" id="vendor-name"
               name="name"
               [(ngModel)]="modifiedVendor()!.vendorName"/>
      </div>

      <div class="col-8">
        <label for="vendor-specialization" class="form-label">Specialization</label>
        <input class="form-control" id="vendor-specialization"
               name="specialization"
               [(ngModel)]="modifiedVendor()!.vendorSpecialization"/>
      </div>

      <div class="col-8">
        <label for="vendor-nation" class="form-label">Nation</label>
        <input class="form-control" id="vendor-nation"
               name="nation"
               [(ngModel)]="modifiedVendor()!.vendorHqNation"/>
      </div>

      <div class="col-3">
        <label for="vendor-city" class="form-label">City</label>
        <input class="form-control" id="vendor-city"
               name="city"
               [(ngModel)]="modifiedVendor()!.vendorHqCity"/>
      </div>

      <div class="col-3">
        <label for="vendor-street" class="form-label">Street</label>
        <input class="form-control" id="vendor-street"
               name="price"
               [(ngModel)]="modifiedVendor()!.vendorHqStreet"/>
      </div>

      <div class="col-3">
        <label for="vendor-zip" class="form-label">Zip Code</label>
        <input class="form-control" id="vendor-zip"
               name="zip"
               [(ngModel)]="modifiedVendor()!.vendorHqZIP"/>
      </div>


      <hr class="my-4"/>
      <h3 class="text-body">Actions</h3>
      <div>
        <button type="button"
                class="btn btn-success m-2"
                (click)="saveChanges()">{{ isNewVendor() ? 'Create Vendor' : 'Save Changes' }}</button>

        @if(!isNewVendor())
        {
          <button type="button"
                  class="btn btn-danger m-2"
                  (click)="deleteVendor()">
            Delete Vendor
          </button>
        }

        <button type="button" class="btn btn-warning m-2" (click)="discardChanges()">Discard Changes</button>

        <a routerLink="/vendors" class="btn btn-secondary m2">
          Go Back
        </a>
      </div>
    </form>
  }
  @else if (errorMessage())
  {
    <p class="text-danger">{{ errorMessage() }}</p>
  }
  @else
  {
    <p>Loading vendor details</p>
  }

</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">{{ toastTitle() }}</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      {{ toastMessage() }}
    </div>
  </div>
</div>
