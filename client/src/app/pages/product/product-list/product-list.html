

@if(errorMessage())
{
  <p class="text-danger">{{ errorMessage() }}</p>
}
@else
{
  <button class="btn btn-primary btn-sm float-end me-3 mb-2 mt-3"
          (click)="viewProductDetails(-1)">
    Add Product
  </button>

  <table class="table table-striped text-center table-bordered w-75 mx-auto mt-3 table-rounded">
    <thead>
    <tr>
      <th colspan="4" class="fs-2">Products</th>
    </tr>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Description</th>
      <th>Price</th>
    </tr>
    </thead>
    <tbody>
      @for (product of products() ; track product.productID)
      {
        <tr (click)="viewProductDetails(product.productID)">
          <td>{{ product.productID }}</td>
          <td>{{ product.productName }}</td>
          <td>{{ product.productDescription}}</td>
          <td>{{ product.productPrice | currency}}</td>
        </tr>
      }
      @empty
      {
        <tr>
          <td colspan="8">
            No Products Found
          </td>
        </tr>
      }
    </tbody>
  </table>
}
